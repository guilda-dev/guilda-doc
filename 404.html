  <title data-title-ja="GUILDA ドキュメント - ページが見つかりません">GUILDA Documentation - Page not found</title>
  <script>
    // GitHub Pages serves this page for any missing path, at any depth. On a project site
    // (<user>.github.io/<repo>/...) the site root is the first folder, so links and assets
    // resolve against it. Opened from a file or another host, relative links are used as they are.
    (function () {
      var seg = location.pathname.split('/')[1];
      if (/^https?:$/.test(location.protocol) && /\.github\.io$/.test(location.hostname) && seg && seg !== '404.html') {
        document.write('<base href="/' + seg + '/">');
      }
    })();
  </script>

    @keyframes nf-trip { from { transform: rotate(36deg); } to { transform: rotate(0deg); } }
    .nf-code { margin: 0 0 6px; color: var(--muted); font-family: var(--font-mono); font-size: 0.9rem; letter-spacing: 0.08em; }
